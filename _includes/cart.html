{% assign L = site.data[page.lang] %}
{% assign l = page.lang %}

<div class="cart-bd" id="cartBd" hidden></div>

<aside class="cart" id="cart" hidden aria-label="{{ L.carrito.titulo }}" role="dialog" aria-modal="true">
  <div class="cart-hd">
    <h2>{{ L.carrito.titulo }}</h2>
    <button id="cartClose" aria-label="{{ L.carrito.cerrar }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="cart-body" id="cartBody"></div>

  <div class="cart-ft" id="cartFt" hidden>
    <div class="cart-line"><span>{{ L.carrito.subtotal }}</span><span id="cartSub"></span></div>
    <div class="cart-line"><span>{{ L.carrito.envio }}</span><span id="cartShip"></span></div>
    <div class="cart-line cart-total"><span>{{ L.carrito.total }}</span><span id="cartTotal"></span></div>
    <button class="btn btn-wa" id="cartCheckout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3.2-6.4L20 4l-1.4 3.3A8 8 0 0 1 20 12z"/></svg>
      {{ L.carrito.finalizar }}
    </button>
    <p class="cart-note">{{ L.carrito.nota }}</p>
  </div>
</aside>
