# ---------------------------------------------------------------
# LINA Home — configuración de Jekyll
# GitHub Pages ejecuta Jekyll solo. No hace falta instalar nada.
# ---------------------------------------------------------------

title: LINA Home
description: חנות עיצוב לבית בישראל
# Por ahora el sitio vive en woldmanelias-ops.github.io/lina-home/
# Cuando compres el dominio: cambiá url a "https://www.linahomeil.com",
# baseurl a "" y cargá el dominio en Settings → Pages → Custom domain.
url: "https://woldmanelias-ops.github.io"
baseurl: "/lina-home"

# Datos de contacto — CAMBIAR ACÁ y se actualiza en todo el sitio
marca:
  nombre: LINA
  nombre_he: לינה
  whatsapp: "972552478806"
  whatsapp_display: "055-247-8806"
  email: linahome@gmail.com
  instagram: "https://instagram.com/linahome"
  facebook: "https://facebook.com/linahome"
  envio_costo: 20

  # Datos legales: aparecen en el תקנון, la política de privacidad y la
  # declaración de accesibilidad. Mientras estén vacíos, esas líneas
  # simplemente no se muestran. Completalos cuando abras el עוסק.
  titular: ""                    # nombre completo del dueño del עוסק
  numero_osek: ""                # número de עוסק פטור / מורשה
  direccion: ""                  # dirección para devoluciones
  coordinador_accesibilidad: ""  # nombre del responsable (puede ser el tuyo)

# ---------------------------------------------------------------
# Cobros — Tranzila
# Mientras tranzila_terminal esté vacío, el carrito pide los datos de
# envío y cierra el pedido por WhatsApp (como hasta ahora).
# Cuando Tranzila te dé el nombre de la terminal, escribilo acá y el
# botón pasa a "Pagar": tarjetas, Bit y Google Pay en su página segura.
# ---------------------------------------------------------------
pago:
  tranzila_terminal: ""   # ej.: "linahome" — te lo da Tranzila al firmar
  bit: true               # Tranzila tiene que activarte Bit en la terminal
  google_pay: true
  paypal: false           # true solo si Tranzila te activa PayPal
  cuotas_max: 1           # 1 = sin cuotas. Ej.: 3 deja pagar hasta en 3 cuotas

# Colecciones: cada idioma es una colección independiente.
# Así cada producto y cada artículo tiene su propia URL indexable.
collections:
  he:
    output: true
    permalink: /he/:path/
  en:
    output: true
    permalink: /en/:path/

defaults:
  - scope:
      path: ""
      type: he
    values:
      lang: he
      dir: rtl
  - scope:
      path: ""
      type: en
    values:
      lang: en
      dir: ltr
  - scope:
      path: "he"
    values:
      lang: he
      dir: rtl
  - scope:
      path: "en"
    values:
      lang: en
      dir: ltr

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

sass:
  style: compressed
