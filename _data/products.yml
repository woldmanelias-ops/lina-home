# ===============================================================
# CATÁLOGO — fuente única de verdad.
# Para agregar un producto: copiá un bloque, cambiá los valores,
# y creá las dos fichas en _he/producto/ y _en/producto/.
#
# slug        → define la URL. Solo minúsculas, guiones, sin ñ ni acentos.
# categoria   → salon | dormitorio | bano
# precio      → en shékels, sin símbolo.
# destacado   → true lo muestra en la home.
# nuevo       → orden del catálogo (número más alto = más nuevo).
# img         → archivo dentro de assets/img/. Si no existe, se dibuja
#               un placeholder de color con el nombre encima.
# ===============================================================

- slug: shatiach-kutna-bezh
  categoria: salon
  precio: 349
  destacado: true
  nuevo: 4
  img: shatiach-kutna-bezh.webp
  color: "#C9B8A3"
  he:
    nombre: שטיח כותנה ארוג בגוון בז׳
    corto: שטיח רך בגוון חול, ארוג ביד מכותנה טבעית.
    medidas: 160 × 230 ס״מ
    material: 100% כותנה
  en:
    nombre: Handwoven cotton rug in sand
    corto: A soft, flat-woven rug in a warm sand tone.
    medidas: 160 × 230 cm
    material: 100% cotton

